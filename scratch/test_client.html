<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perps Exchange - Real-time Ingestion Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap');

        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top left, #16161a 0%, #0d0d11 100%);
            color: #e1e1e6;
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .dashboard-container {
            max-width: 1300px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 20px;
            margin-bottom: 24px;
        }

        h1 {
            font-weight: 700;
            font-size: 28px;
            margin: 0;
            background: linear-gradient(135deg, #a78bfa 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }

        @media (max-width: 1000px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: rgba(28, 28, 35, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .panel-full {
            grid-column: 1 / -1;
        }

        h3 {
            margin: 0 0 16px 0;
            font-size: 18px;
            font-weight: 500;
            color: #a9a9b3;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 99px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .status-badge.connected {
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
            border: 1px solid rgba(74, 222, 128, 0.2);
        }

        .status-badge.disconnected {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(248, 113, 113, 0.2);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            font-family: 'Outfit', sans-serif;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.04);
            color: #e1e1e6;
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            outline: none;
        }

        button:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        button.primary-ws {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.2) 0%, rgba(129, 140, 248, 0.2) 100%);
            border-color: rgba(139, 92, 246, 0.4);
            color: #c084fc;
        }

        button.primary-ws:hover {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.3) 0%, rgba(129, 140, 248, 0.3) 100%);
            border-color: rgba(139, 92, 246, 0.6);
        }

        button.primary-wt {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.2) 0%, rgba(56, 189, 248, 0.2) 100%);
            border-color: rgba(14, 165, 233, 0.4);
            color: #38bdf8;
        }

        button.primary-wt:hover {
            background: linear-gradient(135deg, rgba(14, 165, 233, 0.3) 0%, rgba(56, 189, 248, 0.3) 100%);
            border-color: rgba(14, 165, 233, 0.6);
        }

        .log-container {
            position: relative;
        }

        .log {
            background: #0d0d11;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            padding: 16px;
            height: 200px;
            overflow-y: auto;
            font-family: 'Roboto Mono', monospace;
            font-size: 11px;
            line-height: 1.6;
            color: #a9a9b3;
        }

        .log::-webkit-scrollbar {
            width: 6px;
        }

        .log::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
        }

        .chart-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        canvas {
            background: #08080b;
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            width: 100%;
            height: 250px;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.8);
        }

        .incoming-candle-stat {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
            margin-top: 16px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }

        .stat-card span {
            display: block;
        }

        .stat-card .label {
            font-size: 11px;
            color: #8e8e93;
            text-transform: uppercase;
            margin-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .stat-card .value {
            font-size: 15px;
            font-weight: 600;
            font-family: 'Roboto Mono', monospace;
        }

        .green {
            color: #22c55e;
        }

        .red {
            color: #ef4444;
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <header>
            <h1>Perps Ingestion & Candlestick Monitor</h1>
            <div style="font-size: 14px; color: #8e8e93;">Fast Ingestion Path Test (WS/WT)</div>
        </header>

        <div class="grid">
            <!-- WebSocket Controls -->
            <div class="panel">
                <h3>
                    WebSocket Gateway
                    <span id="ws-status" class="status-badge disconnected">Disconnected</span>
                </h3>
                <div class="btn-group">
                    <button class="primary-ws" onclick="connectWS()">Connect WS</button>
                    <button onclick="subscribeWS()">Subscribe Book/Trades</button>
                    <button onclick="subscribeCandlesWS()">Subscribe Candles (1m)</button>
                </div>
                <div class="log-container">
                    <div id="ws-log" class="log"></div>
                </div>
            </div>

            <!-- WebTransport Controls -->
            <div class="panel">
                <h3>
                    WebTransport Gateway
                    <span id="wt-status" class="status-badge disconnected">Disconnected</span>
                </h3>
                <div class="btn-group">
                    <button class="primary-wt" onclick="connectWT()">Connect WT</button>
                    <button onclick="subscribeWT()">Subscribe Book/Trades</button>
                    <button onclick="subscribeCandlesWT()">Subscribe Candles (1m)</button>
                </div>
                <div class="log-container">
                    <div id="wt-log" class="log"></div>
                </div>
            </div>

            <!-- Live Candlestick Graph -->
            <div class="panel panel-full chart-panel">
                <h3 style="width: 100%;">
                    <span>Live 1m Candlestick Chart</span>
                    <span style="font-size: 13px; font-weight: normal; color: #8e8e93;">Aggregating Real-Time Redis
                        PubSub Ticks</span>
                </h3>
                <canvas id="candle-chart" width="1200" height="250"></canvas>

                <div class="incoming-candle-stat">
                    <div class="stat-card">
                        <span class="label">Open</span>
                        <span id="stat-open" class="value">-</span>
                    </div>
                    <div class="stat-card">
                        <span class="label">High</span>
                        <span id="stat-high" class="value">-</span>
                    </div>
                    <div class="stat-card">
                        <span class="label">Low</span>
                        <span id="stat-low" class="value">-</span>
                    </div>
                    <div class="stat-card">
                        <span class="label">Close</span>
                        <span id="stat-close" class="value">-</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let ws;
        let wt;
        let wtWriter;
        let candlesList = [];

        // Add a dummy initial chart drawing
        window.addEventListener('load', () => {
            drawChart();
        });

        // Helper to output to logs
        function log(elementId, msg) {
            const el = document.getElementById(elementId);
            el.innerHTML += `[${new Date().toLocaleTimeString()}] ${msg}<br>`;
            el.scrollTop = el.scrollHeight;
        }

        // Process incoming stream data
        function processStreamedMessage(rawText) {
            try {
                const parsed = JSON.parse(rawText);

                // Check if it is a Candle update
                if (parsed.timestamp && parsed.open && parsed.high && parsed.low && parsed.close) {
                    const candle = {
                        timestamp: parseInt(parsed.timestamp),
                        open: parseFloat(parsed.open),
                        high: parseFloat(parsed.high),
                        low: parseFloat(parsed.low),
                        close: parseFloat(parsed.close),
                        volume: parseFloat(parsed.volume)
                    };

                    // Update UI metrics cards
                    updateStatsCard(candle);

                    // Update or append local list
                    const existingIndex = candlesList.findIndex(c => c.timestamp === candle.timestamp);
                    if (existingIndex !== -1) {
                        candlesList[existingIndex] = candle;
                    } else {
                        candlesList.push(candle);
                        // Sort chronologically and limit
                        candlesList.sort((a, b) => a.timestamp - b.timestamp);
                        if (candlesList.length > 20) {
                            candlesList.shift();
                        }
                    }
                    drawChart();
                }
            } catch (e) {
                // Not a candle message, ignore drawing
            }
        }

        function updateStatsCard(candle) {
            const valColor = candle.close >= candle.open ? "green" : "red";

            document.getElementById("stat-open").innerText = candle.open.toFixed(2);
            document.getElementById("stat-high").innerText = candle.high.toFixed(2);
            document.getElementById("stat-low").innerText = candle.low.toFixed(2);

            const closeEl = document.getElementById("stat-close");
            closeEl.innerText = candle.close.toFixed(2);
            closeEl.className = "value " + valColor;
        }

        function drawChart() {
            const canvas = document.getElementById("candle-chart");
            const ctx = canvas.getContext("2d");

            // Clear
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (candlesList.length === 0) {
                ctx.fillStyle = "#8e8e93";
                ctx.font = "14px Outfit";
                ctx.textAlign = "center";
                ctx.fillText("Waiting for real-time candle stream... (Click Subscribe and submit trades)", canvas.width / 2, canvas.height / 2);
                return;
            }

            // Find price range boundaries
            let minPrice = Math.min(...candlesList.map(c => c.low));
            let maxPrice = Math.max(...candlesList.map(c => c.high));
            let range = maxPrice - minPrice || 10;

            // Add padding
            minPrice -= range * 0.15;
            maxPrice += range * 0.15;
            range = maxPrice - minPrice;

            const paddingLeft = 40;
            const paddingRight = 80;
            const chartWidth = canvas.width - paddingLeft - paddingRight;
            const candleWidth = chartWidth / candlesList.length;

            const scaleY = (val) => canvas.height - 30 - ((val - minPrice) / range) * (canvas.height - 60);

            // Draw horizontal price grid lines
            ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
            ctx.lineWidth = 1;
            ctx.fillStyle = "#8e8e93";
            ctx.font = "10px Roboto Mono";
            ctx.textAlign = "left";

            for (let i = 0; i <= 4; i++) {
                const price = minPrice + (range * i) / 4;
                const y = scaleY(price);
                ctx.beginPath();
                ctx.moveTo(paddingLeft, y);
                ctx.lineTo(canvas.width - paddingRight, y);
                ctx.stroke();
                ctx.fillText(price.toFixed(2), canvas.width - paddingRight + 10, y + 3);
            }

            // Draw candlesticks
            for (let i = 0; i < candlesList.length; i++) {
                const c = candlesList[i];
                const x = paddingLeft + i * candleWidth + candleWidth / 2;

                const yOpen = scaleY(c.open);
                const yClose = scaleY(c.close);
                const yHigh = scaleY(c.high);
                const yLow = scaleY(c.low);

                const isGreen = c.close >= c.open;
                const color = isGreen ? "#22c55e" : "#ef4444";

                ctx.strokeStyle = color;
                ctx.fillStyle = color;
                ctx.lineWidth = 2;

                // Wick lines
                ctx.beginPath();
                ctx.moveTo(x, yHigh);
                ctx.lineTo(x, yLow);
                ctx.stroke();

                // Candle body rectangle
                const bodyHeight = Math.max(Math.abs(yClose - yOpen), 3);
                ctx.fillRect(x - (candleWidth * 0.25), Math.min(yOpen, yClose), candleWidth * 0.5, bodyHeight);
            }
        }

        // WS Connection
        function connectWS() {
            ws = new WebSocket("ws://127.0.0.1:8080/ws");
            ws.onopen = () => {
                document.getElementById("ws-status").className = "status-badge connected";
                document.getElementById("ws-status").innerText = "Connected";
                log("ws-log", "WebSocket connected!");
            };
            ws.onmessage = (event) => {
                log("ws-log", "Received: " + event.data);
                processStreamedMessage(event.data);
            };
            ws.onclose = () => {
                document.getElementById("ws-status").className = "status-badge disconnected";
                document.getElementById("ws-status").innerText = "Disconnected";
                log("ws-log", "WebSocket disconnected.");
            };
        }

        function subscribeWS() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const subMsg = JSON.stringify({
                    action: "subscribe",
                    channels: ["orderbook:BTCUSDT", "trades:BTCUSDT"]
                });
                ws.send(subMsg);
                log("ws-log", "Sent subscription for orderbook & trades.");
            } else {
                log("ws-log", "Error: WebSocket is not open.");
            }
        }

        function subscribeCandlesWS() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                const subMsg = JSON.stringify({
                    action: "subscribe",
                    channels: ["candles:BTCUSDT:1m"]
                });
                ws.send(subMsg);
                log("ws-log", "Sent subscription for candles:BTCUSDT:1m.");
            } else {
                log("ws-log", "Error: WebSocket is not open.");
            }
        }

        // WT Connection
        async function connectWT() {
            const hashBytes = new Uint8Array([66, 169, 171, 117, 150, 9, 185, 152, 46, 141, 232, 17, 90, 35, 138, 141, 230, 71, 70, 71, 67, 19, 248, 168, 224, 235, 18, 143, 154, 166, 104, 221]);

            try {
                wt = new WebTransport("https://127.0.0.1:4433/", {
                    serverCertificateHashes: [
                        {
                            algorithm: "sha-256",
                            value: hashBytes
                        }
                    ]
                });

                log("wt-log", "Initiating WebTransport handshake...");
                await wt.ready;
                document.getElementById("wt-status").className = "status-badge connected";
                document.getElementById("wt-status").innerText = "Connected";
                log("wt-log", "WebTransport connection established!");

                // Establish bidirectional stream
                const stream = await wt.createBidirectionalStream();
                const writer = stream.writable.getWriter();
                const reader = stream.readable.getReader();
                wtWriter = writer;

                // Read loop for WebTransport responses
                tokioStyleReaderLoop(reader);
            } catch (e) {
                log("wt-log", "Connection failed: " + e.message);
                console.error(e);
            }
        }

        async function tokioStyleReaderLoop(reader) {
            const decoder = new TextDecoder();
            try {
                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    const text = decoder.decode(value);
                    log("wt-log", "Received: " + text);
                    processStreamedMessage(text);
                }
            } catch (e) {
                log("wt-log", "Read error: " + e.message);
            }
        }

        async function subscribeWT() {
            if (wtWriter) {
                const subMsg = JSON.stringify({
                    action: "subscribe",
                    channels: ["orderbook:BTCUSDT", "trades:BTCUSDT"]
                });
                const encoder = new TextEncoder();
                await wtWriter.write(encoder.encode(subMsg));
                log("wt-log", "Sent WT subscription command.");
            } else {
                log("wt-log", "Error: WebTransport stream is not open.");
            }
        }

        async function subscribeCandlesWT() {
            if (wtWriter) {
                const subMsg = JSON.stringify({
                    action: "subscribe",
                    channels: ["candles:BTCUSDT:1m"]
                });
                const encoder = new TextEncoder();
                await wtWriter.write(encoder.encode(subMsg));
                log("wt-log", "Sent WT subscription command for candles:BTCUSDT:1m.");
            } else {
                log("wt-log", "Error: WebTransport stream is not open.");
            }
        }
    </script>
</body>

</html>
