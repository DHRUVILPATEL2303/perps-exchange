version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: perps-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=perps
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "max_connections=500"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: perps-pgbouncer
    volumes:
      - ./configs/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini
      - ./configs/userlist.txt:/etc/pgbouncer/userlist.txt
    ports:
      - "6432:6432"
    depends_on:
      postgres:
        condition: service_healthy

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: perps-timescaledb
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=perps_charts
    volumes:
      - timescaledb_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: perps-redis
    ports:
      - "6379:6379"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: perps-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

  init-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: perps-init-kafka
    depends_on:
      kafka:
        condition: service_started
    entrypoint:
      [
        "bash",
        "-c",
        "kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic order-events --partitions 1 --replication-factor 1 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic execution-reports --partitions 1 --replication-factor 1 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic binance-liquidations --partitions 1 --replication-factor 1 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic price-feed --partitions 1 --replication-factor 1 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic liquidations --partitions 1 --replication-factor 1 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic orderbook-depth --partitions 1 --replication-factor 1 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic solana-deposits --partitions 1 --replication-factor 1",
      ]

  market-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market-service
    command: ["market-service"]
    ports:
      - "50051:50051"
    environment:
      - RUST_LOG=info
      - DATABASE__HOST=pgbouncer
      - DATABASE__PORT=6432
      - REDIS__HOST=redis
      - SERVER__HOST=0.0.0.0
      - GRPC__HOST=0.0.0.0
    depends_on:
      pgbouncer:
        condition: service_started

  account-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: account-service
    command: ["account-service"]
    ports:
      - "50053:50053"
    environment:
      - RUST_LOG=info
      - DATABASE__HOST=pgbouncer
      - DATABASE__PORT=6432
      - REDIS__HOST=redis
      - SERVER__HOST=0.0.0.0
      - GRPC__HOST=0.0.0.0
    depends_on:
      pgbouncer:
        condition: service_started

  trading-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-service
    command: ["trading-service"]
    ports:
      - "50052:50052"
      - "8082:8082"
    environment:
      - RUST_LOG=info
      - DATABASE__HOST=pgbouncer
      - DATABASE__PORT=6432
      - REDIS__HOST=redis
      - SERVER__HOST=0.0.0.0
      - GRPC__HOST=0.0.0.0
      - MARKET_SERVICE_URL=http://market-service:50051
      - ACCOUNT_SERVICE_URL=http://account-service:50053
      - RISK_SERVICE_URL=http://risk-engine-service:50057
    depends_on:
      pgbouncer:
        condition: service_started
      kafka:
        condition: service_started
      init-kafka:
        condition: service_completed_successfully


  risk-engine-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: risk-engine-service
    command: ["risk-engine-service"]
    ports:
      - "50057:50057"
    environment:
      - RUST_LOG=info
      - DATABASE__HOST=pgbouncer
      - DATABASE__PORT=6432
      - REDIS__HOST=redis
      - SERVER__HOST=0.0.0.0
      - GRPC__HOST=0.0.0.0
      - ACCOUNT_SERVICE_URL=http://account-service:50053
      - TRADING_SERVICE_URL=http://trading-service:50052
    depends_on:
      pgbouncer:
        condition: service_started
      kafka:
        condition: service_started
      init-kafka:
        condition: service_completed_successfully

  matching-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: matching-engine
    command: ["matching-engine"]
    ports:
      - "8086:8086"
    environment:
      - RUST_LOG=debug
      - DATABASE__HOST=pgbouncer
      - DATABASE__PORT=6432
      - REDIS__HOST=redis
      - SERVER__HOST=0.0.0.0
      - GRPC__HOST=0.0.0.0
      - OTLP_ENDPOINT=http://jaeger:4317
      - SERVICE_NAME=matching-engine
    depends_on:
      kafka:
        condition: service_started
      init-kafka:
        condition: service_completed_successfully


  oracle-aggregator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oracle-aggregator
    command: ["oracle-aggregator"]
    environment:
      - RUST_LOG=info
      - DATABASE__HOST=pgbouncer
      - DATABASE__PORT=6432
      - REDIS__HOST=redis
      - SERVER__HOST=0.0.0.0
      - GRPC__HOST=0.0.0.0
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_started
      init-kafka:
        condition: service_completed_successfully

  binance-liquidation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: binance-liquidation
    command: ["binance-liquidation"]
    environment:
      - RUST_LOG=info
      - DATABASE__HOST=pgbouncer
      - DATABASE__PORT=6432
      - REDIS__HOST=redis
      - SERVER__HOST=0.0.0.0
      - GRPC__HOST=0.0.0.0
    depends_on:
      kafka:
        condition: service_started
      init-kafka:
        condition: service_completed_successfully

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-gateway
    command: ["api-gateway"]
    ports:
     - "8080:8080"
     - "4433:4433/udp"

    environment:
      - RUST_LOG=info
      - DATABASE__HOST=pgbouncer
      - DATABASE__PORT=6432
      - REDIS__HOST=redis
      - SERVER__HOST=0.0.0.0
      - GRPC__HOST=0.0.0.0
      - MARKET_SERVICE_URL=http://market-service:50051
      - TRADING_SERVICE_URL=http://trading-service:50052
      - ACCOUNT_SERVICE_URL=http://account-service:50053
      - CHART_SERVICE_URL=http://chart-service:50058
      - DISABLE_LOGS=true
    depends_on:
      trading-service:
        condition: service_started
      chart-service:
        condition: service_started

  chart-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chart-service
    command: ["chart-service"]
    ports:
      - "50058:50058"
    volumes:
      - ./configs/chart-service.toml:/app/configs/chart-service.toml
    environment:
      - RUST_LOG=info
      - DATABASE__HOST=timescaledb
      - DATABASE__PORT=5432
      - DATABASE__DATABASE=perps_charts
      - REDIS__HOST=redis
      - GRPC__HOST=0.0.0.0
    depends_on:
      timescaledb:
        condition: service_started
      kafka:
        condition: service_started
      init-kafka:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    depends_on:
      - api-gateway

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards/perps_dashboard.json:/var/lib/grafana/dashboards/perps_dashboard.json
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "8089:8080"

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - QUERY_UI_CONFIG=/etc/jaeger/jaeger-ui.json
    volumes:
      - ./docker/jaeger/jaeger-ui.json:/etc/jaeger/jaeger-ui.json

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-bot
    command: ["telegram-bot"]
    environment:
      - RUST_LOG=info
      - TELOXIDE_TOKEN=8233121865:AAGKof5-00eWRzqW1NTT_d1ZyGwIIo5-PlM
      - KAFKA_BROKERS=kafka:29092
      - TELEGRAM_MINI_APP_URL=https://dhruvilpatel.github.io/perps-tma-placeholder
    depends_on:
      kafka:
        condition: service_started

  blockchain-listener:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: blockchain-listener
    command: ["blockchain-listener"]
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgres://postgres:postgres@pgbouncer:6432/perps_accounts
      - KAFKA_BROKERS=kafka:29092
      - SOLANA_RPC_URL=https://devnet.helius-rpc.com/?api-key=b07f07b6-4c5a-417d-9c31-93300c828917
    depends_on:
      pgbouncer:
        condition: service_started
      kafka:
        condition: service_started

volumes:
  postgres_data:
  timescaledb_data:
