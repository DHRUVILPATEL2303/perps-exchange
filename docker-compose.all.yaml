version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: perps-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=perps
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: perps-timescaledb
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=perps_charts
    volumes:
      - timescaledb_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: perps-redis
    ports:
      - "6379:6379"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: perps-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

  init-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: perps-init-kafka
    depends_on:
      kafka:
        condition: service_started
    entrypoint:
      [
        "bash",
        "-c",
        "kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic order-events --partitions 1 --replication-factor 1 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic execution-reports --partitions 1 --replication-factor 1 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic binance-liquidations --partitions 1 --replication-factor 1 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic price-feed --partitions 1 --replication-factor 1 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic liquidations --partitions 1 --replication-factor 1 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic orderbook-depth --partitions 1 --replication-factor 1",
      ]

  aeron-media-driver:
    image: eclipse-temurin:17-jdk
    container_name: aeron-media-driver
    restart: unless-stopped
    command: >
      sh -c "apt-get update && apt-get install -y wget &&
             ( [ -f aeron-all-1.44.0.jar ] || wget https://repo1.maven.org/maven2/io/aeron/aeron-all/1.44.0/aeron-all-1.44.0.jar ) &&
             java --add-opens java.base/sun.nio.ch=ALL-UNNAMED --add-opens java.base/java.nio=ALL-UNNAMED -cp aeron-all-1.44.0.jar -Daeron.dir=/dev/shm/aeron io.aeron.driver.MediaDriver"
    volumes:
      - /dev/shm:/dev/shm

  market-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: market-service
    command: ["market-service"]
    ports:
      - "50051:50051"
    environment:
      - RUST_LOG=info
      - DATABASE__HOST=postgres
      - REDIS__HOST=redis
      - SERVER__HOST=0.0.0.0
      - GRPC__HOST=0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy

  account-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: account-service
    command: ["account-service"]
    ports:
      - "50053:50053"
    environment:
      - RUST_LOG=info
      - DATABASE__HOST=postgres
      - REDIS__HOST=redis
      - SERVER__HOST=0.0.0.0
      - GRPC__HOST=0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy

  trading-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trading-service
    command: ["trading-service"]
    ports:
      - "50052:50052"
    volumes:
      - /dev/shm:/dev/shm
    environment:
      - RUST_LOG=info
      - DATABASE__HOST=postgres
      - REDIS__HOST=redis
      - SERVER__HOST=0.0.0.0
      - GRPC__HOST=0.0.0.0
      - MARKET_SERVICE_URL=http://market-service:50051
      - ACCOUNT_SERVICE_URL=http://account-service:50053
      - RISK_SERVICE_URL=http://risk-engine-service:50057
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      init-kafka:
        condition: service_completed_successfully
      aeron-media-driver:
        condition: service_started

  risk-engine-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: risk-engine-service
    command: ["risk-engine-service"]
    ports:
      - "50057:50057"
    volumes:
      - /dev/shm:/dev/shm
    environment:
      - RUST_LOG=info
      - DATABASE__HOST=postgres
      - REDIS__HOST=redis
      - SERVER__HOST=0.0.0.0
      - GRPC__HOST=0.0.0.0
      - ACCOUNT_SERVICE_URL=http://account-service:50053
      - TRADING_SERVICE_URL=http://trading-service:50052
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      init-kafka:
        condition: service_completed_successfully
      aeron-media-driver:
        condition: service_started

  matching-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: matching-engine
    command: ["matching-engine"]
    volumes:
      - /dev/shm:/dev/shm
    environment:
      - RUST_LOG=info
      - DATABASE__HOST=postgres
      - REDIS__HOST=redis
      - SERVER__HOST=0.0.0.0
      - GRPC__HOST=0.0.0.0
    depends_on:
      kafka:
        condition: service_started
      init-kafka:
        condition: service_completed_successfully
      aeron-media-driver:
        condition: service_started

  oracle-aggregator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oracle-aggregator
    command: ["oracle-aggregator"]
    environment:
      - RUST_LOG=info
      - DATABASE__HOST=postgres
      - REDIS__HOST=redis
      - SERVER__HOST=0.0.0.0
      - GRPC__HOST=0.0.0.0
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_started
      init-kafka:
        condition: service_completed_successfully

  binance-liquidation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: binance-liquidation
    command: ["binance-liquidation"]
    environment:
      - RUST_LOG=info
      - DATABASE__HOST=postgres
      - REDIS__HOST=redis
      - SERVER__HOST=0.0.0.0
      - GRPC__HOST=0.0.0.0
    depends_on:
      kafka:
        condition: service_started
      init-kafka:
        condition: service_completed_successfully

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-gateway
    command: ["api-gateway"]
    ports:
     - "8080:8080"
     - "4433:4433/udp" 

    environment:
      - RUST_LOG=info
      - DATABASE__HOST=postgres
      - REDIS__HOST=redis
      - SERVER__HOST=0.0.0.0
      - GRPC__HOST=0.0.0.0
      - MARKET_SERVICE_URL=http://market-service:50051
      - TRADING_SERVICE_URL=http://trading-service:50052
      - ACCOUNT_SERVICE_URL=http://account-service:50053
      - CHART_SERVICE_URL=http://chart-service:50058
    depends_on:
      trading-service:
        condition: service_started
      chart-service:
        condition: service_started

  chart-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chart-service
    command: ["chart-service"]
    ports:
      - "50058:50058"
    volumes:
      - ./configs/chart-service.toml:/app/configs/chart-service.toml
    environment:
      - RUST_LOG=info
      - DATABASE__HOST=timescaledb
      - DATABASE__PORT=5432
      - DATABASE__DATABASE=perps_charts
      - REDIS__HOST=redis
      - GRPC__HOST=0.0.0.0
    depends_on:
      timescaledb:
        condition: service_started
      kafka:
        condition: service_started
      init-kafka:
        condition: service_completed_successfully

volumes:
  postgres_data:
  timescaledb_data:
