[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/config",
    "crates/errors",
    "crates/telemetry",
    "crates/types",
    "crates/utils",
    "crates/database",
    "crates/proto",
    "crates/tui-client",
    "crates/desktop-client/src-tauri",

    "services/api-gateway",
    "services/account-service",
    "services/market-service",
    "services/trading-service",
    "services/binance-liquidation", "services/oracle-aggregator",
    "services/matching-engine", "services/risk-engine-service", "services/chart-service",
]
[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
authors = ["Dhruvil Patel"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
actix-web = "4"
actix-cors = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust_decimal = { version = "1", features = ["serde"]}
thiserror = "2"
anyhow = "1"
async-trait = "0.1.91"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
dotenvy = "0.15"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "rust_decimal",
    "chrono",
] }
chrono = { version = "0.4", features = ["serde"] }
redis = { version = "0.32", features = ["tokio-comp"] }
config = "0.15"
prost = "0.14"
prost-types = "0.14"

tonic = "0.14"
tonic-build = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
futures-util = "0.3"




opentelemetry = { version = "0.27", features = ["trace"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.28"
prometheus = "0.13"

#kafka
rdkafka = { version = "0.36", features = ["tokio"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }

actix-ws = "0.3"
tokio-stream = "0.1"

wtransport = { version = "0.1.13", features = ["self-signed"] }
