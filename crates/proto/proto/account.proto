syntax = "proto3";

package account;

service AccountService {
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
  rpc LockMargin(LockMarginRequest) returns (LockMarginResponse);
  rpc ReleaseMargin(ReleaseMarginRequest) returns (ReleaseMarginResponse);
  rpc AdjustMargin(AdjustMarginRequest) returns (AdjustMarginResponse);
  rpc GetTransactionHistory(GetTransactionHistoryRequest) returns (GetTransactionHistoryResponse);
  rpc GetDepositAddress(GetDepositAddressRequest) returns (GetDepositAddressResponse);
  rpc Withdraw(WithdrawRequest) returns (WithdrawResponse);
}

message WithdrawRequest {
  string user_id = 1;
  string amount = 2;
  string asset = 3;
  string destination_address = 4;
}

message WithdrawResponse {
  string tx_hash = 1;
  string new_balance = 2;
}

message GetBalanceRequest {
  string user_id = 1;
  string asset = 2;
}
message GetBalanceResponse {
  string available_balance = 1;
  string locked_balance = 2;
}

message LockMarginRequest {
  string user_id = 1;

  string amount = 2;
  string reference_id = 3;
}
message LockMarginResponse {
  bool success = 1;
  string error_message = 2;
}

message ReleaseMarginRequest {
  string user_id = 1;
  string amount = 2;
  string reference_id = 3;
}
message ReleaseMarginResponse {
  bool success = 1;
}

message AdjustMarginRequest {
  string user_id = 1;
  string amount = 2;
  string adjustment_type = 3;
}
message AdjustMarginResponse {
  string new_balance = 1;
}

message GetTransactionHistoryRequest {
  string user_id = 1;
  optional int32 page = 2;
  optional int32 limit = 3;
}
message GetTransactionHistoryResponse {
  repeated TransactionInfo transactions = 1;
}
message TransactionInfo {
  string id = 1;
  string user_id = 2;
  string asset = 3;
  string amount = 4;
  string transaction_type = 5;
  string status = 6;
  string tx_hash = 7;
  string created_at = 8;
}

message GetDepositAddressRequest {
  string user_id = 1;
}
message GetDepositAddressResponse {
  string pda_address = 1;
  string usdc_ata = 2;
  string usdt_ata = 3;
}
